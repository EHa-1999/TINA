<style>
/* Layout: een demokader met daarin het portaal zoals de inwoner het ziet, in een browservenster; eronder de balk die toont wat het portaal opvraagt. Vormtaal gelijk aan XENA en MIRA. */
:root{
  --bg:#eaeff0; --surface:#ffffff; --surface2:#f3f7f7; --line:#d3dcde; --fg:#15262b; --muted:#536970;
  --accent:#0d6470; --accent-fg:#ffffff; --accent-soft:#dcedef; --sel:#e2f0f2;
  --amber:#8f5400; --amber-soft:#fbefd6; --red:#a8261d; --red-soft:#fbe3e0;
  --violet:#5b3fa6; --violet-soft:#ebe5f8; --green:#1b6f3f; --green-soft:#def2e5;
  --paper:#ffffff; --desk:#ece8e1; --mark:#fbe9a8; --shadow:0 10px 30px rgba(10,40,46,.18);
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --serif:'IBM Plex Serif',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1618; --surface:#162023; --surface2:#1c292d; --line:#2c3c41; --fg:#e4eced; --muted:#93a7ad;
  --accent:#58b9c7; --accent-fg:#06272c; --accent-soft:#17383e; --sel:#1b3a40;
  --amber:#f0b656; --amber-soft:#3a2c10; --red:#f28b82; --red-soft:#3d1c19;
  --violet:#b7a2f0; --violet-soft:#2a2244; --green:#6fcf97; --green-soft:#163322;
  --paper:#1b2427; --desk:#101415; --mark:#5a4a12; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e1618; --surface:#162023; --surface2:#1c292d; --line:#2c3c41; --fg:#e4eced; --muted:#93a7ad;
  --accent:#58b9c7; --accent-fg:#06272c; --accent-soft:#17383e; --sel:#1b3a40;
  --amber:#f0b656; --amber-soft:#3a2c10; --red:#f28b82; --red-soft:#3d1c19;
  --violet:#b7a2f0; --violet-soft:#2a2244; --green:#6fcf97; --green-soft:#163322;
  --paper:#1b2427; --desk:#101415; --mark:#5a4a12; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4,p,dl,dd,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
svg{display:block;flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.shell{display:flex;flex-direction:column;gap:10px;padding-block:12px;padding-inline:16px;max-width:1240px;margin-inline:auto}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.ttl{flex:1 1 240px;min-width:0}
.ttl h1{font-size:17px;font-weight:600}
.ttl h1 small{font-size:12px;font-weight:500;color:var(--muted);margin-left:10px;white-space:nowrap}
.ttl .sub{color:var(--muted);font-size:12.5px}
.seg{display:flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:6px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.lang{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.linkbtn{color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:6px;border:1px solid var(--line);font-weight:500;background:var(--surface)}
.btn:hover{background:var(--sel)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08);background:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:500;line-height:18px;white-space:nowrap}
.p-green{background:var(--green-soft);color:var(--green)} .p-amber{background:var(--amber-soft);color:var(--amber)}
.p-red{background:var(--red-soft);color:var(--red)} .p-violet{background:var(--violet-soft);color:var(--violet)}
.p-grey{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.hint{font-size:12.5px;color:var(--muted)}

/* browservenster */
.win{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgba(10,40,46,.10)}
.brw{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--surface2);border-bottom:1px solid var(--line)}
.brw .dots{display:flex;gap:5px}.brw .dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.brw .url{flex:1;min-width:0;font-family:var(--mono);font-size:11.5px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.brw .url b{color:var(--fg);font-weight:500}

/* het portaal */
.skip{position:absolute;left:-999px}.skip:focus{position:static;display:inline-block;margin:6px 16px;padding:6px 10px;background:var(--accent);color:var(--accent-fg);border-radius:6px}
.ph{background:var(--accent);color:var(--accent-fg);padding:14px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
.ph .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;color:inherit;text-decoration:none}
.ph .brand small{display:block;font-weight:400;font-size:12px;opacity:.85}
.ph .crest{width:34px;height:34px;border-radius:8px;border:1.5px solid currentColor;display:grid;place-items:center;font-family:var(--serif);font-weight:600}
.ph nav{margin-left:auto;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px}
.ph nav button{color:inherit;text-decoration:underline;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,currentColor 45%,transparent)}
.ph nav button[aria-current="page"]{text-decoration-thickness:2px;text-decoration-color:currentColor;font-weight:600}
.ph :focus-visible{outline-color:var(--accent-fg)}
.pm{padding:22px 24px 30px;display:grid;gap:18px}
.crumbs{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:12.5px;color:var(--muted)}
.crumbs li+li::before{content:"›";margin-right:8px}
.h-lead{display:grid;gap:6px;max-width:68ch}
.h-lead h2{font-family:var(--serif);font-size:26px;line-height:1.2;font-weight:600;text-wrap:balance}
.h-lead p{color:var(--muted);font-size:15px}
.sbox{display:flex;flex-wrap:wrap;gap:8px;max-width:760px}
.sbox label{position:absolute;left:-999px}
.sbox input{flex:1 1 260px;min-width:0;padding:11px 14px;font-size:16px;border:2px solid var(--accent);border-radius:8px;background:var(--surface)}
.sbox .btn{padding:11px 20px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.chip{border:1px solid var(--line);border-radius:99px;padding:3px 11px;background:var(--surface);color:var(--fg);display:inline-flex;gap:6px;align-items:baseline}
.chip:hover{background:var(--sel)} .chip b{font-weight:500;color:var(--muted);font-size:11px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)} .chip[aria-pressed="true"] b{color:inherit}
.sec-h{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:8px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.cat{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:500}
.cat:hover{border-color:var(--accent);background:var(--sel)} .cat b{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.cat.todo{border-style:dashed;color:var(--muted);cursor:default}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
.info{background:var(--surface2);border-radius:10px;padding:14px 16px;display:grid;gap:8px;font-size:13.5px}
.info h3{font-size:14px}
.rl{display:grid;gap:0}
.r{padding:13px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:start}
.r-b{display:grid;gap:4px;min-width:0}
.r-dl{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);background:var(--surface)}
.r-dl:hover{background:var(--sel);border-color:var(--accent)}
.r:last-child{border-bottom:1px solid var(--line)}
.r h3{font-size:16px;font-weight:600;line-height:1.3}
.r h3 button{color:var(--accent);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.r h3 button:hover{text-decoration-thickness:2px}
.r .m{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12.5px;color:var(--muted);align-items:center}
.r p{font-size:14px;max-width:78ch}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.res{display:grid;grid-template-columns:230px minmax(0,1fr);gap:26px;align-items:start}
.fac{display:grid;gap:14px}
.fac fieldset{border:0;padding:0;margin:0;display:grid;gap:3px}
.fac legend{font-weight:600;font-size:13px;padding:0;margin-bottom:4px}
.fac label{display:flex;gap:8px;align-items:baseline;font-size:13.5px;padding:2px 0;cursor:pointer}
.fac label span{flex:1;min-width:0} .fac label b{font-weight:400;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.fac input{accent-color:var(--accent);margin:0;transform:translateY(1px)}
.rh{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:6px}
.rh .n{font-size:14px} .rh .n b{font-weight:600}
.rh label{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.rh select{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.empty{padding:26px 0;color:var(--muted);max-width:60ch}

/* documentpagina */
.dp{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:start}
.dh{display:grid;gap:6px}
.dh h2{font-family:var(--serif);font-size:24px;line-height:1.25;font-weight:600;text-wrap:balance}
.dh .m{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);align-items:center}
.desk{background:var(--desk);border-radius:10px;padding:16px}
.paper{background:var(--paper);box-shadow:0 1px 4px rgba(0,0,0,.18);padding:26px 34px 34px;font-family:var(--serif);font-size:14.5px;line-height:1.65;display:grid;gap:10px;max-width:720px;margin-inline:auto}
.paper .pm0{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--sans);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:6px}
.paper h3{font-size:20px;line-height:1.25;font-weight:600;text-wrap:balance}
.paper p{max-width:64ch}
.plh{font-family:var(--mono);font-size:.82em;background:var(--violet-soft);color:var(--violet);border-radius:4px;padding:1px 5px;white-space:nowrap;cursor:help;border:0}
.desk .cap{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
.side{display:grid;gap:10px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px;background:var(--surface)}
.card h3{font-size:13px;font-weight:600;display:flex;gap:7px;align-items:center}
.card .kv{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 10px;font-size:13px}
.card .kv dt{color:var(--muted)} .card .kv dd{overflow-wrap:anywhere}
.card code,.mono{font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere}
.card .btn{justify-content:center}
.seal{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.seal .ok{color:var(--green)}
.chk{display:grid;gap:5px;font-size:13px}
.chk li{display:flex;gap:7px;align-items:flex-start} .chk svg{color:var(--green);margin-top:2px}
.om{display:grid;gap:6px;font-size:13px}
.om li{display:grid;gap:1px} .om small{color:var(--muted);font-size:12px}
.copy{display:flex;gap:6px;align-items:center} .copy code{flex:1;min-width:0;background:var(--surface2);border-radius:6px;padding:5px 8px}
.inv{width:100%;border-collapse:collapse;font-size:13.5px}
.inv th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:6px 10px;background:var(--surface2);white-space:nowrap}
.inv td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
.inv td small{display:block;color:var(--muted);font-size:12px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.pf{border-top:1px solid var(--line);padding:14px 24px;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--muted);background:var(--surface2)}

/* achter het portaal */
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:stretch}
.fb{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px;align-content:start;background:var(--surface);position:relative}
.fb h3{font-size:14px} .fb p{font-size:13px;color:var(--muted)}
.fb .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;color:var(--muted)}
.fb.int{background:var(--surface2)} .fb.pub{border-color:var(--accent)}
.fb+.fb::before{content:"→";position:absolute;left:-10px;top:14px;transform:translateX(-50%);color:var(--muted);font-weight:600}
.wall{grid-column:1/-1;display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--muted)}
.wall::before,.wall::after{content:"";flex:1;border-top:2px dashed var(--line)}
.pts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.pts div{border-left:3px solid var(--accent);padding:2px 0 2px 12px;display:grid;gap:3px}
.pts b{font-size:14px} .pts span{font-size:13px;color:var(--muted)}

.hood{background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:12px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;padding:6px 12px}
.hood b{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;flex:none}
.hood code{flex:1 1 300px;min-width:0;font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere}
.foot{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
#layer:empty{display:none}
#layer{position:fixed;inset:0;background:rgba(8,24,28,.45);display:grid;place-items:center;padding:16px;z-index:30}
.dlg{background:var(--surface);border-radius:10px;box-shadow:var(--shadow);width:100%;max-height:100%;overflow:auto}
/* colofon */
@property --ca{syntax:'<angle>';inherits:false;initial-value:0deg}
.dlg.colo{max-width:640px;padding:0;gap:0;display:flex;flex-direction:column;position:relative;overflow:hidden;isolation:isolate;border:1px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,conic-gradient(from var(--ca,0deg),var(--accent),var(--violet),var(--amber),var(--green),var(--accent)) border-box;animation:clBorder 8s linear infinite}
.colo .cfx{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:-1;border-radius:inherit}
.colo .cin{overflow:auto;min-height:0;flex:1}
.colo .aur{position:absolute;inset:-40%;z-index:-1;pointer-events:none;opacity:.32;filter:blur(40px);background:radial-gradient(closest-side at 30% 30%,var(--accent),transparent 70%),radial-gradient(closest-side at 70% 40%,var(--violet),transparent 70%),radial-gradient(closest-side at 50% 75%,var(--amber),transparent 70%);animation:clAur 18s ease-in-out infinite alternate}
.colo .sp{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:0;pointer-events:none;z-index:0;animation:clSp 6s ease-in-out infinite}
.colo .chead{display:flex;gap:16px;align-items:center;padding:18px 18px 4px}
.colo .seal{flex:none;width:96px;height:96px;position:relative}
.colo .seal svg.ring{position:absolute;inset:0;animation:clSpin 28s linear infinite}
.colo .seal text{font:600 8.4px var(--mono,monospace);letter-spacing:.18em;fill:var(--accent)}
.colo .seal svg.core{position:absolute;inset:22px;width:52px;height:52px}
.colo .seal .draw{stroke-dasharray:120;stroke-dashoffset:120;animation:clDraw 1.6s .3s ease-out forwards}
.colo h2.ct{font-size:24px;margin:0;font-weight:700;letter-spacing:-.01em;background:linear-gradient(100deg,var(--fg) 20%,var(--accent) 40%,var(--violet) 50%,var(--fg) 70%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:clShine 6s ease-in-out infinite}
.colo .csub{color:var(--muted);font-size:12.5px;margin-top:2px}
.colo .mb{padding:10px 18px 4px}
.colo dl{display:grid;grid-template-columns:132px minmax(0,1fr);gap:9px 14px;margin:0;font-size:13px}
.colo dt{color:var(--muted)}
.colo dd{margin:0;display:flex;flex-direction:column;gap:1px;overflow-wrap:anywhere}
.colo dd small{color:var(--muted);font-size:12px}
.colo dd ul{list-style:disc;margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.colo dd li{display:list-item;border:0;padding:0}
.colo dd a{color:var(--accent)}
.colo .sel{user-select:all;font-family:var(--mono);font-size:12px}
.colo .cl{opacity:0;transform:translateY(8px);animation:clIn .55s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i)*85ms + 250ms)}
.colo .cnote{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px;color:var(--muted);font-size:12px}
.colo .cfoot{display:flex;justify-content:flex-end;padding:10px 18px 16px}
@media (max-width:560px){.colo .chead{flex-direction:column;align-items:flex-start}.colo dl{grid-template-columns:1fr;gap:2px}.colo dd{margin-bottom:8px}}
@media (prefers-reduced-motion:reduce){.dlg.colo,.colo .aur,.colo .sp,.colo .seal svg.ring,.colo h2.ct{animation:none}.colo .cl{animation:none;opacity:1;transform:none}.colo .seal .draw{animation:none;stroke-dashoffset:0}}
@keyframes clBorder{to{--ca:360deg}}
@keyframes clAur{0%{transform:translate(-6%,-4%) rotate(0deg) scale(1)}100%{transform:translate(6%,5%) rotate(25deg) scale(1.12)}}
@keyframes clSp{0%{opacity:0;transform:translateY(10px) scale(.6)}30%{opacity:.8}100%{opacity:0;transform:translateY(-60px) scale(1.2)}}
@keyframes clSpin{to{transform:rotate(360deg)}}
@keyframes clDraw{to{stroke-dashoffset:0}}
@keyframes clShine{0%{background-position:100% 0}100%{background-position:0 0}}
@keyframes clIn{to{opacity:1;transform:none}}



.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;z-index:20;max-width:min(380px,calc(100% - 32px))}
.toast{background:var(--fg);color:var(--bg);padding:8px 12px;border-radius:8px;font-size:13px;box-shadow:var(--shadow)}

@media (max-width:860px){
  .two,.res,.dp{grid-template-columns:minmax(0,1fr)}
  .flow{grid-template-columns:minmax(0,1fr)} .fb+.fb::before{content:"↓";left:50%;top:-10px;transform:translate(-50%,-50%)}
  .pm{padding:16px 16px 24px} .ph{padding:12px 16px} .ph nav{margin-left:0} .pf{padding:12px 16px}
  .paper{padding:18px 18px 24px} .desk{padding:10px}
  .fac{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border:1px solid var(--line);border-radius:10px;padding:12px}
  .rh label{margin-left:0}
}
</style>

ERSOON 1], wohnhaft in [ADRES 1], bat um eine Parkuntersuchung für die Seitenstraßen.","Bij de zoekslag zijn acht documenten gevonden. Vier documenten worden volledig openbaar gemaakt, drie gedeeltelijk en één niet.":"Beim Suchlauf wurden acht Dokumente gefunden. Vier Dokumente werden vollständig veröffentlicht, drei teilweise und eines nicht.","Bijvoorbeeld: Houtplein, leges, vergunning":"Zum Beispiel: Houtplein, Gebühren, Genehmigung","Binnen":"Innen","Bladeren op soort informatie":"Nach Art der Information stöbern","Blijkt er toch iets te veel te staan, dan haalt de gemeente het document uit het depot. De vaste link meldt dan dat het is ingetrokken, met de datum.":"Steht doch etwas zu viel darin, dann nimmt die Gemeinde das Dokument aus dem Depot. Der feste Link meldet dann, dass es zurückgezogen wurde, mit dem Datum.","Bouwen en wonen":"Bauen und Wohnen","Buiten":"Außen","Burgemeester en wethouders verlenen aan [PERSOON 1] een omgevingsvergunning voor het plaatsen van een dakopbouw aan de achterzijde van de woning aan de Kleverlaan 12.":"Bürgermeister und Beigeordnete erteilen [PERSOON 1] eine Baugenehmigung für die Errichtung eines Dachaufbaus an der Rückseite des Wohnhauses Kleverlaan 12.","Colofon":"Impressum","Contact":"Kontakt","Controleer het zegel":"Siegel prüfen","Copyright":"Urheberrecht","Dat zijn plaatshouders. Daar stond een naam, een adres of een persoonlijke opvatting die de gemeente niet openbaar mag of hoeft te maken. Klik op een plaatshouder om de reden te lezen.":"Das sind Platzhalter. Dort stand ein Name, eine Adresse oder eine persönliche Auffassung, die die Gemeinde nicht veröffentlichen darf oder muss. Klicken Sie auf einen Platzhalter, um den Grund zu lesen.","Datum":"Datum","De Hoge Weide":"De Hoge Weide","De aanbesteding loopt nog. Openbaarmaking kan de financiële belangen van de gemeente schaden (Woo artikel 5.1, tweede lid, onder b).":"Die Vergabe läuft noch. Eine Veröffentlichung kann den finanziellen Interessen der Gemeinde schaden ( 6.":"Der Gestaltungsbeirat hat eine positive Stellungnahme abgegeben. Die Gebühren wurden nach der Gebührensatzung 2026 berechnet.","Deels openbaar":"Teilweise öffentlich","Deze link blijft werken, ook als het document later wordt verplaatst.":"Dieser Link funktioniert weiter, auch wenn das Dokument später verschoben wird.","Dit document draagt een elektronisch zegel van de gemeente. Daarmee kun je nagaan dat het echt is en niet is veranderd.":"Dieses Dokument trägt ein elektronisches Siegel der Gemeinde. Damit können Sie prüfen, ob es echt ist und nicht verändert wurde.","Dit memo zet de gevolgen op een rij voor de vergunningen voor terrassen en evenementen op het plein. [BELEIDSOPVATTING 1]":"Dieses Memo listet die Folgen für die Genehmigungen für Außengastronomie und Veranstaltungen auf dem Platz auf. [BELEIDSOPVATTING 1]","Dit onderzoek brengt de verkeersstromen en de parkeerdruk rond het Houtplein in beeld. De tellingen zijn gehouden in maart 2026.":"Diese Untersuchung zeigt die Verkehrsströme und den Parkdruck rund um den Houtplein. Die Zählungen fanden im März 2026 statt.","Dit plan beschrijft de doelen, de planning en de participatie met omwonenden en ondernemers. De grootste risico's zitten in het verkeer tijdens de uitvoering en in het behoud van de bomen.":"Dieser Plan beschreibt die Ziele, die Planung und die Beteiligung von Anwohnenden und Gewerbetreibenden. Die größten Risiken liegen beim Verkehr während der Bauarbeiten und beim Erhalt der Bäume.","Document":"Dokument","Documenten bij dit verzoek":"Dokumente zu diesem Antrag","Download het document":"Dokument herunterladen","Download het hele dossier":"Die gesamte Akte herunterladen","Download het hele dossier {0}":"Die gesamte Akte {0} herunterladen","Drie platanen worden verplant naar de rand van het plein. Twee bomen zijn ziek en worden gekapt. Daarvoor komen acht nieuwe bomen terug.":"Drei Platanen werden an den Rand des Platzes verpflanzt. Zwei Bäume sind krank und werden gefällt. Dafür werden acht neue Bäume gepflanzt.","Duurzaam formaat":"Dauerhaftes Format","Duurzaamheid":"Nachhaltigkeit","Echt":"Echt","Echtheid":"Echtheit","Een aparte opslag met alleen de gepubliceerde versies en een eigen zoekindex.":"Ein getrennter Speicher nur mit den veröffentlichten Fassungen und einem eigenen Suchindex.","Een demo, geen product. Alle voorbeeldgegevens zijn verzonnen: personen, adressen, dossiers en zaaknummers bestaan niet. De demo toont wat de architectuur mogelijk maakt; een deel van de functies is toekomstbeeld.":"Eine Demo, kein Produkt. Alle Beispieldaten sind erfunden: Personen, Adressen, Akten und Vorgangsnummern existieren nicht. Die Demo zeigt, was die Architektur ermöglicht; ein Teil der Funktionen ist Zukunftsbild.","Een persoonlijke opvatting van een medewerker in een stuk voor intern beraad (Woo artikel 5.2).":"Eine persönliche Auffassung einer oder eines Beschäftigten in einem Dokument für die interne Beratung (Artikel 5.2 Woo).","Een verzonnen portaal voor een demo. Personen, documenten en nummers bestaan niet.":"Ein erfundenes Portal für eine Demo. Personen, Dokumente und Nummern gibt es nicht.","Eindrapportage fietsenstalling Stationsplein":"Abschlussbericht Fahrradparkhaus Stationsplein","Elk document op dit portaal is door de gemeente verzegeld op het moment van publiceren. Het zegel is een digitale handtekening van de organisatie.":"Jedes Dokument in diesem Portal wurde von der Gemeinde beim Veröffentlichen versiegelt. Das Siegel ist eine digitale Unterschrift der Organisation.","Evenementen":"Veranstaltungen","Evenementenvergunning Circuit Zandvoort":"Veranstaltungsgenehmigung Circuit Zandvoort","Eén richting: van binnen naar buiten. Het portaal kan niets opvragen uit de opslag.":"Eine Richtung: von innen nach außen. Das Portal kann nichts aus dem Speicher abrufen.","Eén zip-bestand: {0} documenten, {1}. Met de inventaris en het zegel van elk document.":"Eine ZIP-Datei: {0} Dokumente, {1}. Mit dem Dokumentenverzeichnis und dem Siegel jedes Doku errière le portail","Achtergrond":"Contexte","Actie voor [PERSOON 1]: een memo over de parkeerdruk opstellen.":"Action pour [PERSOON 1] : rédiger une note sur la pression de stationnement.","Adres weggelaten":"Adresse retirée","Advies bomen Houtplein":"Avis arbres Houtplein","Adviezen":"Avis","Afdeling i-Ontwikkeling, Gemeente Haarlem":"Service i-Ontwikkeling, commune de Haarlem","Alle documenten":"Tous les documents","Alle voorbeeldgegevens zijn verzonnen.":"Toutes les données d'exemple sont fictives.","Alleen de geanonimiseerde versie":"Uniquement la version anonymisée","Begroting herinrichting Houtplein":"Budget réaménagement de la Houtplein","Belanghebbenden kunnen binnen zes weken bezwaar maken.":"Les personnes concernées peuvent déposer une réclamation dans un délai de six semaines.","Belastingen en leges":"Impôts et redevances","Beleid en plannen":"Politiques et plans","Beschikkingen":"Décisions","Besluit op Woo-verzoek herinrichting Houtplein":"Décision sur la demande Woo réaménagement de la Houtplein","Besluit op {0}":"Décision du {0}","Besproken: de werkvoorraad, de werkinstructie leges en de vragen van bewoners over het kappen van bomen bij de herinrichting van het Houtplein.":"Points abordés : la charge de travail, le mode opératoire sur la redevance et les questions des habitants sur l'abattage des arbres lors du réaménagement de la Houtplein.","Beste overeenkomst":"Meilleure correspondance","Bewoners maken zich zorgen over de parkeerdruk en over het kappen van de platanen. [PERSOON 1], wonend aan [ADRES 1], vroeg om een parkeeronderzoek voor de zijstraten.":"Les habitants s'inquiètent de la pression de stationnement et de l'abattage des platanes. [PERSOON 1], domicilié(e) à [ADRES 1], a demandé une étude de stationnement pour les rues adjacentes.","Bij de zoekslag zijn acht documenten gevonden. Vier documenten worden volledig openbaar gemaakt, drie gedeeltelijk en één niet.":"La recherche a permis de trouver huit documents. Quatre documents sont rendus entièrement publics, trois partiellement et un ne l'est pas.","Bijvoorbeeld: Houtplein, leges, vergunning":"Par exemple : Houtplein, redevance, permis","Binnen":"À l'intérieur","Bladeren op soort informatie":"Parcourir par type d'information","Blijkt er toch iets te veel te staan, dan haalt de gemeente het document uit het depot. De vaste link meldt dan dat het is ingetrokken, met de datum.":"S'il s'avère qu'un document en dit quand même trop, la commune le retire du dépôt. Le lien permanent indique alors qu'il a été retiré, avec la date.","Bouwen en wonen":"Construction et logement","Buiten":"À l'extérieur","Burgemeester en wethouders verlenen aan [PERSOON 1] een omgevingsvergunning voor het plaatsen van een dakopbouw aan de achterzijde van de woning aan de Kleverlaan 12.":"Le maire et les adjoints accordent à [PERSOON 1] un permis de construire pour une surélévation de toiture à l'arrière de l'habitation située Kleverlaan 12.","Colofon":"Colophon","Contact":"Contact","Controleer het zegel":"Vérifier le sceau","Copyright":"Droits d'auteur","Dat zijn plaatshouders. Daar stond een naam, een adres of een persoonlijke opvatting die de gemeente niet openbaar mag of hoeft te maken. Klik op een plaatshouder om de reden te lezen.":"Ce sont des repères. Il y avait là un nom, une adresse ou une opinion personnelle que la commune ne peut pas ou n'est pas tenue de rendre publics. Cliquez sur un repère pour en lire le motif.","Datum":"Date","De Hoge Weide":"De Hoge Weide","De aanbesteding loopt nog. Openbaarmaking kan de financiële belangen van de gemeente schaden (Woo artikel 5.1, tweede lid, onder b).":"L'appel d'offres est encore en cours. La publication pourrait nuire aux intérêts financiers de la commune (article 5.1, paragraphe 2, point b, de la Woo).","De architectuurvisie waarop deze demo is gebaseerd":"La vision d'architecture sur laquelle repose cette démo","De burgemeester verleent een evenementenvergunning voor het raceweekend op het circuit.":"Le maire accorde une autorisation de manifestation pour le week-end de course sur le circuit.","De fietsenstalling onder het Stationsplein is opgeleverd binnen budget en drie weken later dan gepland.":"Le parc à vélos situé sous la Stationsplein a été livré dans le respect du budget, avec trois semaines de retard sur le planning.","De persoonlijke levenssfeer weegt hier zwaarder dan openbaarheid (Woo artikel 5.1, tweede lid, onder e).":"Le respect de la vie privée pèse ici plus lourd que la publicité (article 5.1, paragraphe 2, point e, de la Woo).","De raad stelt de tarieven vast voor de leges in 2026. Leges zijn de kosten die de gemeente rekent voor een dienst, zoals een vergunning of een paspoort.":"Le conseil fixe les tarifs de la redevance pour 2026. Une redevance est le montant que la commune facture pour un service, comme un permis ou un passeport.","De stadsecoloog adviseert over de bomen op het Houtplein. Van de zestien platanen kunnen er elf blijven staan.":"L'écologue de la ville donne son avis sur les arbres de la Houtplein. Sur les seize platanes, onze peuvent rester en place.","De stalling heeft 5.100 plekken en is op werkdagen voor 68 procent bezet. De rapportage geeft lessen mee voor volgende projecten, zoals het Houtplein.":"Le parc compte 5 100 places et il est occupé à 68 % en semaine. Ce rapport d'évaluation tire des enseignements pour de prochains projets, comme la Houtplein.","De uitvoering start in het voorjaar van 2027 en duurt naar verwachting veertien maanden.":"Les travaux commencent au printemps 2027 et devraient durer quatorze mois.","De welstandscommissie heeft positief geadviseerd. De leges zijn berekend volgens de legesverordening 2026.":"La commission d'esthétique a rendu un avis favorable. La redevance a été calculée selon le règlement sur les redevances 2026.","Deels openbaar":"Partiellement public","Deze link blijft werken, ook als het document later wordt verplaatst.":"Ce lien continue de fonctionner, même si le document est déplacé plus tard.","Dit document draagt een elektronisch zegel van de gemeente. Daarmee kun je nagaan dat het echt is en niet is veranderd.":"Ce document porte un sceau électronique de la commune. Il vous permet de vérifier qu'il est authentique et qu'il n'a pas été modifié.","Dit memo zet de gevolgen op een rij voor de vergunningen voor terrassen en evenementen op het plein. [BELEIDSOPVATTING 1]":"Cette note fait le point sur les conséquences pour les autorisations de terrasses et de manifestations sur la place. [BELEIDSOPVATTING 1]","Dit onderzoek brengt de verkeersstromen en de parkeerdruk rond het Houtplein in beeld. De tellingen zijn gehouden in maart 2026.":"Cette étude dresse le tableau des flux de circulation et de la pression de stationnement autour de la Houtplein. Les comptages ont eu lieu en mars 2026.","Dit plan beschrijft de doelen, de planning en de participatie met omwonenden en ondernemers. De grootste risico's zitten in het verkeer tijdens de uitvoering en in het behoud van de bomen.":"Ce plan décrit les objectifs, le planning et la concertation avec les riverains et les commerçants. Les plus grands risques concernent la circulation pendant les travaux et la préservation des arbres.","Document":"Document","Documenten bij dit verzoek":"Documents liés à cette demande","Download het document":"Télécharger le document","Download het hele dossier":"Télécharger tout le dossier","Download het hele dossier {0}":"Télécharger tout le dossier {0}","Drie platanen worden verplant naar de rand van het plein. Twee bomen zijn ziek en worden gekapt. Daarvoor komen acht nieuwe bomen terug.":"Trois platanes sont déplacés vers le bord de la place. Deux arbres sont malades et seront abattus. En échange, huit nouveaux arbres seront plantés.","Duurzaam formaat":"Format durable","Duurzaamheid":"Développement durable","Echt":"Authentique","Echtheid":"Authenticité","Een aparte opslag met alleen de gepubliceerde versies en een eigen zoekindex.":"Un stockage distinct, qui contient uniquement les versions publiées et son propre index de recherche.","Een demo, geen product. Alle voorbeeldgegevens zijn verzonnen: personen, adressen, dossiers en zaaknummers bestaan niet. De demo toont wat de architectuur mogelijk maakt; een deel van de functies is toekomstbeeld.":"Une démo, pas un produit. Toutes les données d'exemple sont inventées : personnes, adresses, dossiers et numéros de procédure n'existent pas. La démo montre ce que l'architecture rend possible ; une partie des fonctions relève de la vision d'avenir.","Een persoonlijke opvatting van een medewerker in een stuk voor intern beraad (Woo artikel 5.2).":"Une opinion personnelle d'un agent dans un document destiné à la concertation interne (article 5.2 de la Woo).","Een verzonnen portaal voor een demo. Personen, documenten en nummers bestaan niet.":"Un portail fictif, créé pour une démo. Les personnes, les documents et les numéros n'existent pas.","Eindrapportage fietsenstalling Stationsplein":"Rapport final parc à vélos Stationsplein","Elk document op dit portaal is door de gemeente verzegeld op het moment van publiceren. Het zegel is een digitale handtekening van de organisatie.":"Chaque document de ce portail a été scellé par la commune au moment de sa publication. Le sceau est une signature numérique de l'organisation.","Evenementen":"Manifestations","Evenementenvergunning Circuit Zandvoort":"Autorisation de manifestation Circuit Zandvoort","Eén richting: van binnen naar buiten. Het portaal kan niets opvragen uit de opslag.":"Un seul sens : de l'intérieur vers l'extérieur. Le portail ne peut rien demander au stockage.","Eén zip-bestand: {0} documenten, {1}. Met de inventaris en het zegel van elk document.":"Un seul fichier zip : {0} documents, {1}. Avec l'inventaire et le sceau de chaque document.","Ga naar de inhoud":"Aller au contenu","Gemaakt door":"Réalisé par","Gemeente Haarlem":"Commune de Haarlem","Gemeente Zandvoort":"Commune de Zandvoort","Gemeenten Haarlem en Zandvoort":"Communes de Haarlem et de Zandvoort","Het Common Ground-team en het samenwerkingsverband OWC":"L'équipe Common Ground et le partenariat OWC","Het Houtplein wordt opnieuw ingericht. Het plein krijgt meer groen, minder parkeerplaatsen en een doorgaande fietsroute.":"La Houtplein va être réaménagée. La place aura plus de verdure, moins de places de stationnement et un itinéraire cyclable continu.","Het college stelt de raad voor mee te werken aan de aanleg van een zonnepark op het perceel De Hoge Weide. Portefeuillehouder is wethouder M. de Graaf.":"Le collège propose au conseil de soutenir la création d'un parc solaire sur la parcelle De Hoge Weide. L'adjoint au maire chargé du dossier est M. de Graaf.","Het document heeft koppen, een leesvolgorde en beschrijvingen bij afbeeldingen, zodat een schermlezer het kan voorlezen.":"Le document comporte des titres, un ordre de lecture et des descriptions pour les images, afin qu'un lecteur d'écran puisse le lire à voix haute.","Het document is niet gewijzigd sinds het is verzegeld.":"Le document n'a pas été modifié depuis qu'il a été scellé.","Het gesprek over actieve openbaarmaking: wat de inwoner na publiceren vindt, en hoe":"La réflexion sur la publication proactive : ce que l'habitant trouve après publication, et comment","Het onderzoek beveelt aan om de vergunningzone uit te breiden en de fietsenstalling bij het station beter te benutten.":"L'étude recommande d'étendre la zone de stationnement sur autorisation et de mieux utiliser le parc à vélos de la gare.","Het ontwerp heeft meer groen, minder parkeerplaatsen en een nieuwe fietsroute. De commissie wordt gevraagd om een reactie voordat het definitief ontwerp wordt gemaakt.":"Le projet prévoit plus de verdure, moins de places de stationnement et un nouvel itinéraire cyclable. La commission est invitée à réagir avant l'élaboration du projet définitif.","Het origineel verlaat de opslag niet. Wat hier staat, is een afgeleide zonder persoonsgegevens, in de tekst en in de kenmerken van het bestand.":       +'<div><b>'+esc(t('Vindbaar via de index, herkenbaar via het bestand'))+'</b><span>'+esc(t('Het portaal zoekt in de index van het depot. De kenmerken in de PDF zijn er voor wie het bestand downloadt en later los terugvindt.'))+'</span></div>'
      +'<div><b>'+esc(t('Toegankelijk bij de bron'))+'</b><span>'+esc(t('Koppen, leesvolgorde en beschrijvingen worden gemaakt waar het document ontstaat. Achteraf repareren in een PDF is duurder en slechter.'))+'</span></div>'
      +'<div><b>'+esc(t('Duurzaam formaat'))+'</b><span>'+esc(t('PDF/A-2b blijft leesbaar, maar kent beperkingen: geen ingesloten bestanden, geen scripts. Een rekenblad wordt dus een weergave van het rekenblad.'))+'</span></div>'
      +'<div><b>'+esc(t('Intrekken kan'))+'</b><span>'+esc(t('Blijkt er toch iets te veel te staan, dan haalt de gemeente het document uit het depot. De vaste link meldt dan dat het is ingetrokken, met de datum.'))+'</span></div>'
      +'<div><b>'+esc(t('Meer dan de Woo vraagt'))+'</b><span>'+esc(t('Het portaal is niet beperkt tot de wettelijke categorieën. Welke informatie de gemeente daarbovenop publiceert, is hier nog niet ingevuld.'))+'</span></div></div></div></div>';
}

    +'</dl><div class="cnote cl" style="--i:'+i+'">'+T('Een demo, geen product. Alle voorbeeldgegevens zijn verzonnen: personen, adressen, dossiers en zaaknummers bestaan niet. De demo toont wat de architectuur mogelijk maakt; een deel van de functies is toekomstbeeld.')+'</div></div>'

function render(focusMain){
  document.getElementById('top').innerHTML='<div class="ttl"><h1>TINA<small>Transparent INformation Access</small></h1><div class="sub">'+esc(t('Het zoekportaal voor de inwoner: wat er na publiceren te vinden is.'))+' <span>'+esc(t('Versie {0}',DEMO.v))+'</span> · <span>'+esc(DEMO.d)+'</span> · <button type="button" class="linkbtn" data-act="colofon">'+esc(t('Colofon'))+'</button></div></div>'
    +'<div class="seg" role="group" aria-label="'+esc(t('Weergave'))+'">'+[['portaal','Het portaal'],['achter','Achter het portaal']].map(function(v){return '<button type="button" data-act="view" data-v="'+v[0]+'" aria-pressed="'+(S.view===v[0])+'">'+esc(t(v[1]))+'</button>'}).join('')+'</div>'
    +'<select class="lang" id="lang" aria-label="Taal / Language">'+Object.keys(LANGS).filter(function(l){return l==='nl'||I18N[l]}).map(function(l){return '<option value="'+l+'"'+(l===LANG?' selected':'')+'>'+LANGS[l]+'</option>'}).join('')+'</select>';
  document.getElementById('win').innerHTML=S.view==='portaal'?portal():achter();
  document.getElementById('hood').innerHTML='<b>'+esc(t('Onder de motorkap'))+'</b><code>'+esc(S.wire)+'</code>';
  document.getElementById('foot').innerHTML='<span>TINA · '+esc(t('demo versie {0}, {1}',DEMO.v,DEMO.d))+'</span><span>'+esc(t('Onderdeel van XENA, naast de opslag, MIRA en ELSA.'))+'</span><span>'+esc(t('Alle voorbeeldgegevens zijn verzonnen.'))+'</span>';
  var L=document.getElementById('layer');if(S.colo){if(!L.firstChild){L.innerHTML=colofonHtml();L.querySelector('[data-act="coloX"]').focus()}}else if(L.firstChild){L.innerHTML='';var cb=document.querySelector('[data-act="colofon"]');if(cb)cb.focus()}
  if(focusMain){var m=document.getElementById('inhoud');if(m){m.focus({preventScroll:true});var w=document.getElementById('win');if(w.getBoundingClientRect().top<0)w.scrollIntoView()}}
}
function wire(){
  var n;S.wire=S.route==='home'?'GET https://open.gemeente.org/ → '+t('startpagina')+' · '+t('het portaal leest alleen uit het publicatiedepot')
    :S.route==='zoek'?(n=run().hits.length,'GET /zoek?q='+encodeURIComponent(S.q.trim())+' → '+t('index van het publicatiedepot')+' · '+(n===1?t('1 document'):t('{0} documenten',n))+' · '+t('geen verbinding met de opslag'))
    :S.route==='doc'?'GET /doc/'+BY[S.doc].pid+' → '+t('publicatiedepot')+' · PDF/A-2b · '+t('zegel aanwezig')
    :S.route==='dos'?'GET /woo/'+S.dos+' → '+t('publicatiedepot')+' · '+t('inventaris van het Woo-dossier')
    :'GET /over → '+t('vaste pagina');
}
function go(r,focus){S.route=r;S.view='portaal';S.seal=false;wire();render(focus!==false)}
var A={
  view:function(e){S.view=e.dataset.v;render()},
  go:function(e){if(e.dataset.r==='zoek'&&S.route!=='doc'){S.q=S.q}go(e.dataset.r)},
  ex:function(e){S.q=e.dataset.q;S.f={};go('zoek')},
  add:function(e){var q=e.dataset.q;S.q=(S.q.trim()+' '+(/\s/.test(q)?'"'+q+'"':q)).trim();go('zoek')},
  cat:function(e){S.q='';S.f={cat:{}};S.f.cat[e.dataset.v]=true;go('zoek')},
  clear:function(){S.f={};go('zoek')},
  doc:function(e){S.doc=e.dataset.id;go('doc')},
  dos:function(e){S.dos=e.dataset.id;go('dos')},
  seal:function(){S.seal=true;S.wire='GET /doc/'+BY[S.doc].pid+'/zegel → '+t('zegel en tijdstempel')+' · '+t('controle in de browser, zonder de gemeente te vragen');render()},
  dl:function(){S.wire='GET /doc/'+BY[S.doc].pid+'.pdf → 200 · application/pdf · PDF/A-2b';render();toast(t('In deze demo is er geen bestand om te downloaden.'))},
  dlz:function(e){var nr=e.dataset.id,n=dosFiles(nr).length;S.wire='GET /woo/'+nr+'.zip → 200 · application/zip · '+t('{0} documenten',n)+' · '+dosSize(nr)+' · '+t('inventaris en zegels inbegrepen');render();toast(t('In deze demo is er geen bestand om te downloaden.'))},
  a11y:function(){toast(t('In het echte portaal opent hier een formulier. De gemeente levert het document dan in een leesbare vorm.'))},
  plh:function(e){var p=PLH[e.dataset.k];toast(t(p[1])+'. '+t(p[2]))},
  copy:function(){var el=document.getElementById('purl'),tx=el.textContent,done=function(){toast(t('Link gekopieerd.'))},sel=function(){var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r);toast(t('Link geselecteerd. Kopieer met Ctrl+C.'))};
    try{navigator.clipboard.writeText(tx).then(done,sel)}catch(x){sel()}}
};
document.addEventListener('click',function(ev){if(ev.target.id==='layer'&&S.colo){S.colo=false;render();return}var e=ev.target.closest&&ev.target.closest('[data-act]');if(!e)return;if(e.dataset.act==='colofon'){S.colo=true;render();return}if(e.dataset.act==='coloX'){S.colo=false;render();return}var f=A[e.dataset.act];if(f)f(e)});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&S.colo){S.colo=false;render()}});
document.addEventListener('submit',function(ev){if(ev.target.id!=='sform')return;ev.preventDefault();S.q=document.getElementById('q').value;if(S.route!=='zoek')S.f={};go('zoek',false);var q=document.getElementById('q');if(q)q.focus()});
document.addEventListener('change',function(ev){var e=ev.target;
  if(e.id==='lang'){setLang(e.value,true);wire();render();return}
  if(e.id==='sort'){S.sort=e.value;render();document.getElementById('sort').focus();return}
  if(e.dataset&&e.dataset.fac){var k=e.dataset.fac,id=e.id;S.f[k]=S.f[k]||{};if(e.checked)S.f[k][e.value]=true;else{delete S.f[k][e.value];if(!Object.keys(S.f[k]).length)delete S.f[k]}wire();render();var n=document.getElementById(id);if(n)n.focus()}});
window.__tina={strings:function(){var o=[];CATS.forEach(function(c){o.push(c[1])});Object.keys(STAT).forEach(function(k){o.push(STAT[k][0])});Object.keys(PLH).forEach(function(k){o=o.concat(PLH[k])});
  Object.keys(DOS).forEach(function(k){o.push(DOS[k].title,DOS[k].sum)});DOCS.forEach(function(d){o.push(d.title,d.org,d.theme);if(d.ground)o.push(d.ground);o=o.concat(d.kw,d.body)});FAC.forEach(function(f){o.push(f[1])});return o.concat(EX)},
  setLang:function(l){setLang(l);wire();render()}};
(function(){var l='';try{l=localStorage.getItem('tina.lang')||''}catch(e){}var h=(location.hash||'').slice(1).toLowerCase();if(LANGS[h])l=h;setLang(l||'nl')})();
render();
})();
